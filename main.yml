name: ACEest CI Pipeline

# Run on every push and every pull request, on any branch
on:
  push:
  pull_request:

jobs:
  # ---------------- Stage 1: Build & Lint ----------------
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (syntax errors)
        run: python -m py_compile app.py

      - name: Lint with flake8
        run: flake8 app.py tests/

  # ---------- Stage 2 & 3: Docker build + tests in container ----------
  docker-build-and-test:
    runs-on: ubuntu-latest
    needs: build-and-lint   # only runs if lint passed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aceest-fitness:${{ github.sha }} .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness:${{ github.sha }} pytest -v

      - name: Smoke test the running container
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:5000/health
          docker rm -f aceest
